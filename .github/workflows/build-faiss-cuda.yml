name: faiss-cuda-wheels

# 目标：自动构建“全 CUDA 架构”的 faiss GPU Windows 预编译包，包含 sm_60 (P100)
# 与 sm_70 (V100) —— conda-forge / PyPI 的 faiss-gpu 二进制缺失这两档，导致
# `CUDA error 209 no kernel image is available for execution on the device`。
# 上游 faiss 发一版 -> 这里构建一版；已发布过的版本自动跳过。

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "faiss 标签（如 v1.15.1），留空 = 上游最新 release"
        required: false
        default: ""
      force:
        description: "强制重建（即使本仓库已发布该版本）"
        type: boolean
        default: false
      cuda:
        description: "CUDA 主版本列表（逗号分隔，必须 < 13）"
        required: false
        default: "12.9,12.6"
      python:
        description: "Python 版本列表（逗号分隔）"
        required: false
        default: "3.10,3.11,3.12,3.13"
      arch_mode:
        description: "CUDA 架构范围（major=每个大版本一个 cubin，覆盖最全且构建最快）"
        type: choice
        options: ["major", "min60", "all"]
        default: "major"
      bundle_cuda:
        description: "额外产出“全打包”wheel（内含 CUDA 运行时，约 1GB）"
        type: boolean
        default: false
      strict_patches:
        description: "补丁不适用时直接失败"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-faiss-cuda.yml"
      - ".github/patches/**"
      - "scripts/**"
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write

env:
  UPSTREAM_REPO: facebookresearch/faiss
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1) 解析要构建的 faiss 版本 + 生成构建矩阵（幂等：已发布则跳过）
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_VERSION: ${{ inputs.version }}
          IN_FORCE: ${{ inputs.force }}
          IN_CUDA: ${{ inputs.cuda }}
          IN_PYTHON: ${{ inputs.python }}
          IN_ARCH_MODE: ${{ inputs.arch_mode }}
        run: python scripts/plan_build.py
      - name: Job summary
        run: |
          {
            echo "### 构建计划"
            echo ""
            echo "- faiss: \`${{ steps.plan.outputs.version }}\`"
            echo "- 是否构建: \`${{ steps.plan.outputs.build }}\`"
            echo "- 矩阵: \`${{ steps.plan.outputs.matrix }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2) Windows 构建：python + BLAS + CUDA 工具链全部来自 conda-forge（可复现）
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: cu${{ matrix.cuda_short }} / py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      # 干净解释器，只用于最后给 wheel 做冒烟测试（不含 conda 路径污染）
      - name: Setup clean Python (smoke tests)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 准备 MSVC 环境（工具集由 Runner 决定，nvcc 侧放开版本检查）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 构建环境（python + openblas + CUDA，全部 conda-forge）
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=${{ matrix.python }}
            openblas
            cmake
            ninja
            cuda-version=${{ matrix.cuda_short }}
            cuda-nvcc
            cuda-cudart-dev
            cuda-cuobjdump
            libcublas-dev
            libcurand-dev
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: 解析环境路径
        id: env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # micromamba 的 action 只在 bash 里激活；pwsh 里必须显式用 MAMBA_EXE，
          # 否则 `micromamba` 可能解析到别的 shim 而把参数当成命令执行。
          $mm = $env:MAMBA_EXE
          if (-not $mm -or -not (Test-Path $mm)) {
            $mm = (Get-Command micromamba -ErrorAction SilentlyContinue).Source
          }
          if (-not $mm) { throw "micromamba executable not found" }
          Write-Host "micromamba: $mm"
          $pyOut = & $mm run -n build python -c "import sys;print(sys.prefix)"
          $prefix = (($pyOut | Where-Object { $_ }) | Select-Object -Last 1)
          if ($prefix) { $prefix = "$prefix".Trim() }
          if (-not $prefix) {
            Write-Host "micromamba output: $($pyOut -join ' | ')"
            throw "could not resolve the build env prefix"
          }
          Write-Host "prefix: $prefix"
          function Find-1($name) {
            (Get-ChildItem -Recurse -Filter $name -Path $prefix -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          $nvcc    = Find-1 "nvcc.exe"
          $cuobj   = Find-1 "cuobjdump.exe"
          $blas    = Find-1 "openblas.lib"
          $blasDll = Find-1 "openblas.dll"
          $cudart  = Find-1 "cudart64_12.dll"
          Write-Host "nvcc     : $nvcc"
          Write-Host "cuobjdump: $cuobj"
          Write-Host "openblas : $blas / $blasDll"
          Write-Host "cudart   : $cudart"
          $missing = @()
          foreach ($p in @($nvcc, $cuobj, $blas, $blasDll)) { if (-not $p) { $missing += 1 } }
          if ($missing.Count -gt 0) {
            Get-ChildItem (Join-Path $prefix "Library") -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "Library/: $($_.Name)" }
            Get-ChildItem (Join-Path $prefix "Library\bin") -ErrorAction SilentlyContinue |
              Select-Object -First 50 | ForEach-Object { Write-Host "bin/: $($_.Name)" }
            throw "essential build files not found under $prefix"
          }
          $bin = Split-Path $blasDll
          $cudaBin = if ($cudart) { Split-Path $cudart } else { $bin }
          "prefix=$prefix"    | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "bin=$bin"          | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "cuda_bin=$cudaBin" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "nvcc=$nvcc"        | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "cuobjdump=$cuobj"  | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "blaslib=$blas"
          "mm=$mm"     | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          & $mm run -n build nvcc --version | Select-String "release"

      - name: 安装 python 构建依赖
        shell: pwsh
        run: |
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python -m pip install --upgrade pip setuptools wheel
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python -m pip install numpy packaging swig delvewheel

      - name: 固定 git 行尾（避免 autocrlf 改写补丁内容）
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: 拉取 faiss ${{ needs.plan.outputs.version }} 并打补丁
        shell: pwsh
        run: |
          git clone --depth 1 --branch "${{ needs.plan.outputs.version }}" `
            https://github.com/${{ env.UPSTREAM_REPO }}.git src
          git -C src log --oneline -1
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python scripts/apply_patches.py `
            --src src --patches .github/patches --strict ${{ inputs.strict_patches || 'false' }}

      - name: 计算 CUDA 架构列表
        id: archs
        shell: pwsh
        run: |
          $archs = & "${{ steps.env.outputs.mm }}" run -n build python scripts/cuda_archs.py `
            --mode ${{ matrix.arch_mode }} --nvcc "${{ steps.env.outputs.nvcc }}" --require 60,70
          if ($LASTEXITCODE -ne 0) { throw "cuda_archs.py failed" }
          "archs=$archs" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "CUDA archs: $archs"

      - name: CMake 配置
        shell: pwsh
        run: |
          $env:CUDACXX = "${{ steps.env.outputs.nvcc }}"
          $env:CUDAToolkit_ROOT = "${{ steps.env.outputs.prefix }}\Library"
          $env:CUDA_PATH = "${{ steps.env.outputs.prefix }}\Library"
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build cmake -S src -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_CUDA_COMPILER="${{ steps.env.outputs.nvcc }}" `
            -DCMAKE_CUDA_HOST_COMPILER=cl.exe `
            -DCMAKE_CUDA_ARCHITECTURES="${{ steps.archs.outputs.archs }}" `
            -DCMAKE_CUDA_STANDARD=17 `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -DCUDAToolkit_ROOT="$env:CUDAToolkit_ROOT" `
            -DFAISS_ENABLE_GPU=ON -DFAISS_ENABLE_PYTHON=ON -DFAISS_ENABLE_C_API=ON `
            -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF `
            -DBLA_VENDOR=OpenBLAS `
            -DBLAS_LIBRARIES="${{ steps.env.outputs.blaslib }}" `
            -DLAPACK_LIBRARIES="${{ steps.env.outputs.blaslib }}" `
            -DCMAKE_PREFIX_PATH="${{ steps.env.outputs.prefix }}\Library"

      - name: 编译 libfaiss（含 CUDA 内核）与 python 绑定
        shell: pwsh
        run: |
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build cmake --build build `
            --target faiss faiss_c swigfaiss --parallel $env:NUMBER_OF_PROCESSORS

      - name: 校验 faiss.dll 架构
        shell: pwsh
        run: |
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python scripts/verify_artifact.py `
            --dll build/faiss/faiss.dll --cuobjdump "${{ steps.env.outputs.cuobjdump }}" `
            --require 60,70 --min-archs 4

      - name: 构建 wheel
        shell: pwsh
        env:
          FAISS_VER: ${{ needs.plan.outputs.version }}
          CUDA_TAG: ${{ matrix.cuda_tag }}
        run: |
          $ver = $env:FAISS_VER.TrimStart('v')
          cd build/faiss/python
          # 重写发行版标识：不同 CUDA 版本产物不再重名（PyTorch 风格 local version）
          (Get-Content setup.py) `
            -replace 'name="faiss"', "name=`"faiss_gpu_$($env:CUDA_TAG)`"" `
            -replace 'version="[^"]*"', "version=`"$ver+$($env:CUDA_TAG)`"" |
            Set-Content -Encoding utf8 setup.py
          Select-String -Path setup.py -Pattern 'name=|version=' | Select-Object -First 2
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python setup.py bdist_wheel
          Get-ChildItem dist

      - name: 精简 wheel（CUDA 运行时由系统 / nvidia-*-cu12 提供）
        shell: pwsh
        run: |
          $raw = (Get-ChildItem build/faiss/python/dist/*.whl | Select-Object -First 1).FullName
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python -m delvewheel repair $raw `
            --add-path "${{ steps.env.outputs.bin }}" `
            --exclude "cublas64_*" --exclude "cublasLt64_*" --exclude "cudart64_*" `
            --exclude "curand64_*" --exclude "nvrtc64_*" --exclude "nvJitLink*" `
            --exclude "nppi*" --exclude "npp*" --exclude "cufft64_*" `
            --exclude "cusparse64_*" --exclude "cusolver64_*" `
            -w wheelhouse-light
          Get-ChildItem wheelhouse-light

      - name: 全打包 wheel（可选，内嵌 CUDA 运行时）
        if: ${{ inputs.bundle_cuda }}
        shell: pwsh
        env:
          CUDA_TAG: ${{ matrix.cuda_tag }}
        run: |
          # 独立发行版名（版本后缀 +.full），否则与精简 wheel 同名互相覆盖
          Copy-Item -Recurse -Force build/faiss/python build/faiss/python_full
          (Get-Content build/faiss/python_full/setup.py) `
            -replace '\+cu\d+', "+$($env:CUDA_TAG).full" `
            | Set-Content -Encoding utf8 build/faiss/python_full/setup.py
          Push-Location build/faiss/python_full
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python setup.py bdist_wheel
          Pop-Location
          $raw = (Get-ChildItem build/faiss/python_full/dist/*.whl | Select-Object -First 1).FullName
          & "${{ steps.env.outputs.mm }}" run --no-capture-output -n build python -m delvewheel repair $raw `
            --add-path "${{ steps.env.outputs.bin }}" `
            --add-path "${{ steps.env.outputs.cuda_bin }}" `
            -w wheelhouse-full
          Get-ChildItem wheelhouse-full

      - name: 组装产物（wheel + conda 落地 dll zip + 构建信息）
        shell: pwsh
        env:
          FAISS_VER: ${{ needs.plan.outputs.version }}
          CUDA_TAG: ${{ matrix.cuda_tag }}
        run: |
          $ver = $env:FAISS_VER.TrimStart('v')
          $pyTag = python -c "import sys;print('cp%d%d'%sys.version_info[:2])"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item (Get-ChildItem wheelhouse-light/*.whl | Select-Object -First 1).FullName out/
          Get-ChildItem wheelhouse-full/*.whl -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName out/ }

          # conda / 已有 faiss 环境的落地包
          $dllDir = Join-Path $env:RUNNER_TEMP "dllzip"
          New-Item -ItemType Directory -Force -Path $dllDir | Out-Null
          Copy-Item build/faiss/faiss.dll $dllDir/
          Copy-Item (Join-Path "${{ steps.env.outputs.bin }}" "openblas.dll") $dllDir/
          $note = @(
            "faiss $ver GPU (CUDA ${{ matrix.cuda_short }}) - Windows x64 落地包"
            "========================================================="
            "文件:"
            "  faiss.dll     自编译 libfaiss（含 sm_60/sm_70 等全部 CUDA 架构）"
            "  openblas.dll  该 DLL 链接的 BLAS（conda 官方版链接的是 MKL 的 libblas.dll）"
            ""
            "用法（conda 环境 / 已有 faiss 的 Python 环境）:"
            "  1. 备份原 DLL:"
            "     copy /y `"%CONDA_PREFIX%\Library\bin\faiss.dll`" `"%CONDA_PREFIX%\Library\bin\faiss.dll.bak`""
            "  2. 覆盖:"
            "     copy /y faiss.dll    `"%CONDA_PREFIX%\Library\bin\faiss.dll`""
            "     copy /y openblas.dll `"%CONDA_PREFIX%\Library\bin\openblas.dll`""
            "  3. 验证:"
            "     python -c `"import faiss;print(faiss.__version__, faiss.get_num_gpus())`""
            ""
            "要求: CUDA ${{ matrix.cuda_short }} 运行时（cudart64_12/cublas64_12/curand64_10）"
            "      在 PATH 中，或安装 pip 包 nvidia-cuda-runtime-cu12 / nvidia-cublas-cu12 /"
            "      nvidia-curand-cu12（faiss/__init__.py 会自动 add_dll_directory）。"
            "注意: _swigfaiss.pyd 无需替换，符号与 conda 版 python 绑定兼容。"
          ) -join "`r`n"
          Set-Content -Path (Join-Path $dllDir "README.txt") -Value $note -Encoding utf8
          Compress-Archive -Path "$dllDir/*" `
            -DestinationPath "faiss-$ver-cuda$($env:CUDA_TAG)-$pyTag-win64-dll.zip"

          $info = @(
            "faiss    : $env:FAISS_VER"
            "cuda     : ${{ matrix.cuda }} (conda-forge cuda-version ${{ matrix.cuda_short }})"
            "arch     : ${{ steps.archs.outputs.archs }}"
            "python   : ${{ matrix.python }}"
            "msvc     : runner default toolset"
            "runner   : ${{ runner.os }}-${{ runner.arch }}"
          ) -join "`r`n"
          Set-Content -Path out/BUILD-INFO.txt -Value $info -Encoding utf8
          Get-ChildItem out

      - name: 冒烟测试（精简 wheel + 系统 CUDA 运行时）
        shell: pwsh
        env:
          CUDA_BIN: ${{ steps.env.outputs.cuda_bin }}
        run: |
          $whl = (Get-ChildItem wheelhouse-light/*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $whl
          # 模拟“用户机器上装了 CUDA 运行时”：把它加到 PATH（不靠 conda 激活）
          $env:PATH = "$env:CUDA_BIN;$env:PATH"
          python -c "import faiss;print('light  import OK', faiss.__version__, 'gpus', faiss.get_num_gpus())"
          python scripts/verify_artifact.py --wheel $whl

      - name: 冒烟测试（精简 wheel + pip 的 nvidia-*-cu12，验证 0003 补丁）
        continue-on-error: true
        shell: pwsh
        run: |
          $whl = (Get-ChildItem wheelhouse-light/*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $whl
          python -m pip install nvidia-cuda-runtime-cu12 nvidia-cublas-cu12 nvidia-curand-cu12
          python -c "import faiss,os;print('nvidia-pkgs import OK', faiss.__version__)"
          python -c "import nvidia.cublas,os;print(os.path.join(nvidia.cublas.__path__[0],'bin'))"

      - name: 冒烟测试（全打包 wheel，PATH 中移除 CUDA）
        if: ${{ inputs.bundle_cuda }}
        shell: pwsh
        env:
          CUDA_BIN: ${{ steps.env.outputs.cuda_bin }}
        run: |
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -and ($_ -notlike "$env:CUDA_BIN*") -and ($_ -notlike "*nvidia*") }) -join ';'
          $whl = (Get-ChildItem wheelhouse-full/*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $whl
          python -c "import faiss;print('full   import OK', faiss.__version__, 'gpus', faiss.get_num_gpus())"
          python scripts/verify_artifact.py --wheel $whl --expect-bundled-cuda

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: faiss-${{ matrix.cuda_tag }}-${{ matrix.py_tag }}
          path: |
            out/*.whl
            out/BUILD-INFO.txt
            faiss-*-win64-dll.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) 汇总发布到 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列表
        run: ls -lh dist
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faiss-${{ needs.plan.outputs.version }}
          name: faiss ${{ needs.plan.outputs.version }} · CUDA builds (sm_60~sm_120)
          body: |
            Windows x64 预编译包，GitHub Actions 自动构建（上游 faiss 发新版即自动重建）。

            * 架构包含 **sm_60 (P100) / sm_70 (V100)** 等全部 CUDA 架构 —— conda-forge 与 PyPI
              的 faiss-gpu 构建缺失这两档，导致 `CUDA error 209 no kernel image is available`。
            * `faiss_gpu_<cuXXX>-<ver>+cuXXX-*.whl`：精简版，CUDA 运行时由系统 CUDA（PATH）
              或 pip 的 `nvidia-*-cu12` 提供（`faiss/__init__.py` 会自动注册 DLL 目录）。
            * `faiss_gpu_<cuXXX>-<ver>+cuXXX.full-*.whl`：勾选 `bundle_cuda` 时产出的全打包版。
            * `faiss-<ver>-cuda<cuXXX>-cp3XX-win64-dll.zip`：conda / 已有 faiss 环境的落地包，
              直接替换 `%CONDA_PREFIX%\Library\bin\faiss.dll`（附 openblas.dll 与说明；
              DLL 与 Python 版本无关，文件名带 py 标签只为区分矩阵产物）。

            **CUDA 13 不参与构建**：CUDA 13 已移除 sm_60/sm_70 支持。
            构建矩阵、补丁与验证方式见仓库 README 与 `BUILD-INFO.txt`。
          files: dist/*
          fail_on_unmatched_files: false
